name: Windows client (MinGW UCRT64)

# Same toolchain as the shipped MyOTS.exe (MSYS2 UCRT64, DLLs next to the exe).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/src/**'
      - 'source/CMakeLists.txt'
      - '.github/workflows/windows-mingw.yml'

permissions:
  contents: write

concurrency:
  group: windows-mingw
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Packages
        run: |
          mkdir -p out
          for p in abseil-cpp protobuf luajit glew openal physfs libvorbis libogg openssl spdlog fmt libinih libarchive freetype pugixml nlohmann-json asio parallel-hashmap cpp-httplib utfcpp zlib xz libpng stduuid ixwebsocket cppcodec gmp; do
            if pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-$p > /dev/null 2>&1; then echo "OK $p"; else echo "MISSING $p"; fi
          done | tee out/packages.txt

      - name: Header-only libraries missing in MSYS2
        run: |
          P=/ucrt64
          if grep -q "MISSING stduuid" out/packages.txt; then
            git clone -q --depth 1 https://github.com/mariusbancila/stduuid.git /tmp/stduuid
            cmake -S /tmp/stduuid -B /tmp/stduuid/b -G Ninja -DCMAKE_INSTALL_PREFIX=$P -DUUID_BUILD_TESTS=OFF -DUUID_USING_CXX20_SPAN=ON && cmake --install /tmp/stduuid/b
          fi
          gh_cmake() { # repo dir extra-args
            git clone -q --depth 1 "https://github.com/$1.git" "/tmp/$2"
            cmake -S "/tmp/$2" -B "/tmp/$2/b" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$P "${@:3}" && cmake --build "/tmp/$2/b" && cmake --install "/tmp/$2/b"
          }
          if grep -q "MISSING cpp-httplib" out/packages.txt; then gh_cmake yhirose/cpp-httplib httplib -DHTTPLIB_REQUIRE_OPENSSL=OFF -DHTTPLIB_USE_OPENSSL_IF_AVAILABLE=OFF -DHTTPLIB_USE_BROTLI_IF_AVAILABLE=OFF -DHTTPLIB_USE_ZSTD_IF_AVAILABLE=OFF; fi
          if grep -q "MISSING utfcpp" out/packages.txt; then gh_cmake nemtrif/utfcpp utfcpp -DUTF8_TESTS=OFF -DUTF8_SAMPLES=OFF; fi
          if grep -q "MISSING parallel-hashmap" out/packages.txt; then gh_cmake greg7mdp/parallel-hashmap phmap -DPHMAP_BUILD_TESTS=OFF -DPHMAP_BUILD_EXAMPLES=OFF; fi
          if grep -q "MISSING libinih" out/packages.txt; then echo "inih missing - no INIReader"; fi
          # the client still uses asio::io_service (removed in asio 1.33+): use the last asio that has it
          if [ ! -f $P/include/asio/io_service.hpp ]; then
            git clone -q --depth 1 -b asio-1-30-2 https://github.com/chriskohlhoff/asio.git /tmp/asio
            rm -rf $P/include/asio $P/include/asio.hpp
            cp -r /tmp/asio/asio/include/asio /tmp/asio/asio/include/asio.hpp $P/include/
          fi
          mkdir -p $P/include/stduuid && cp /tmp/stduuid/include/uuid.h $P/include/stduuid/uuid.h
          # the client includes <luajit/lua.hpp> (vcpkg layout); MSYS2 has include/luajit-2.1
          if [ -d $P/include/luajit-2.1 ] && [ ! -f $P/include/luajit/lua.hpp ]; then mkdir -p $P/include/luajit && cp $P/include/luajit-2.1/* $P/include/luajit/; fi
          # single-header libraries from vcpkg.json that MSYS2 does not package
          git clone -q --depth 1 https://github.com/adamyaxley/Obfuscate.git /tmp/obf && cp /tmp/obf/obfuscate.h $P/include/
          git clone -q --depth 1 -b v4.1.0 https://github.com/bshoshany/thread-pool.git /tmp/btp && cp /tmp/btp/include/*.hpp $P/include/
          if grep -q "MISSING cppcodec" out/packages.txt; then
            git clone -q --depth 1 https://github.com/tplgy/cppcodec.git /tmp/cppcodec
            cp -r /tmp/cppcodec/cppcodec $P/include/
          fi
          if grep -q "MISSING ixwebsocket" out/packages.txt; then
            git clone -q --depth 1 https://github.com/machinezone/IXWebSocket.git /tmp/ixws
            cmake -S /tmp/ixws -B /tmp/ixws/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$P -DUSE_TLS=ON -DUSE_OPEN_SSL=ON -DUSE_ZLIB=ON -DBUILD_SHARED_LIBS=OFF && cmake --build /tmp/ixws/b && cmake --install /tmp/ixws/b
          fi

      - name: Configure
        working-directory: source
        run: |
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPTIONS_ENABLE_IPO=OFF -DOPTIONS_ENABLE_SCCACHE=OFF 2>&1 | tee ../out/configure.log
          test -f build-mingw/build.ninja

      - name: Build
        working-directory: source
        run: |
          cmake --build build-mingw 2>&1 | tail -c 300000 | tee ../out/build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Collect (exe + the DLLs it needs)
        if: always()
        run: |
          set +e
          EXE=source/otclient.exe
          ls -la $EXE
          if [ -f "$EXE" ]; then
            mkdir -p out/bin; cp "$EXE" out/bin/MyOTS.exe
            # copy every non-system DLL the exe needs (recursively)
            for i in 1 2 3 4 5; do
              for f in out/bin/*.exe out/bin/*.dll; do
                [ -f "$f" ] && ldd "$f" 2>/dev/null | awk '/ucrt64/{print $3}'
              done | sort -u > /tmp/dlls.txt
              while read d; do [ -f "$d" ] && [ ! -f "out/bin/$(basename "$d")" ] && cp "$d" out/bin/; done < /tmp/dlls.txt
            done
            ls out/bin > out/files.txt
            cat out/files.txt
            (cd out && zip -q -r OurTibia-Windows-mingw.zip bin && sha256sum OurTibia-Windows-mingw.zip bin/MyOTS.exe > zip_sha256.txt)
          fi
          exit 0

      - name: Results to branch results-windows-mingw
        if: always()
        run: |
          R="$RUNNER_TEMP/res"; rm -rf "$R"; mkdir -p "$R"
          cp out/*.txt out/*.log out/*.zip "$R/" 2>/dev/null || true
          if [ -f "$R/OurTibia-Windows-mingw.zip" ]; then split -b 40m "$R/OurTibia-Windows-mingw.zip" "$R/OurTibia-Windows-mingw.zip.part-"; rm "$R/OurTibia-Windows-mingw.zip"; fi
          (cd "$R" && sha256sum *.zip > sha256.txt 2>/dev/null || true)
          echo "${{ job.status }}" > "$R/status.txt"
          cd "$R"; git init -q -b results-windows-mingw
          git config user.name "OurTibia build"; git config user.email "actions@github.com"
          git add -A; git commit -q -m "Windows MinGW build ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:refs/heads/results-windows-mingw"
