name: macOS client

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon (M1 and newer)
            arch: arm64
          - os: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      OURTIBIA_DATA_URL: https://ourtibia.com/downloads/OurTibia-Client.zip
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-${{ matrix.arch }}-${{ hashFiles('source/vcpkg.json', 'source/overlay-ports/**', 'mac-triplets/**') }}
          restore-keys: vcpkg-${{ matrix.arch }}-

      - name: Build OurTibia.app
        run: |
          # Intel runners: Homebrew's libpng (no APNG) in /usr/local would shadow the vcpkg one
          if [ "${{ matrix.arch }}" = "x86_64" ]; then brew unlink libpng 2>/dev/null || true; fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          export OURTIBIA_OVERLAY="$GITHUB_WORKSPACE/client"
          ./BUILD_MAC.command

      - name: Screenshot of the running client
        if: always()
        run: |
          if [ -d out/OurTibia.app ]; then
            open out/OurTibia.app || true
            sleep 40
            screencapture -x out/screenshot-${{ matrix.arch }}.png || true
            pkill -f otclient-bin || true
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OurTibia-macOS-${{ matrix.arch }}
          path: |
            out/*.zip
            out/*.log
            out/*.txt
            out/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Results to branch results-${{ matrix.arch }} (logs, screenshot, zip in parts)
        if: always()
        run: |
          R="$RUNNER_TEMP/results"; rm -rf "$R"; mkdir -p "$R"
          cp out/*.log out/*.txt out/*.png "$R/" 2>/dev/null || true
          for z in out/*.zip; do [ -f "$z" ] && split -b 90m "$z" "$R/$(basename "$z").part-" || true; done
          for z in out/*.zip; do [ -f "$z" ] && (cd out && shasum -a 256 "$(basename "$z")") >> "$R/sha256.txt" || true; done
          cd "$R"
          git init -q -b "results-${{ matrix.arch }}"
          git config user.name "OurTibia build"; git config user.email "actions@github.com"
          git add -A; git commit -q -m "Build ${{ github.run_id }} (${{ matrix.arch }}): ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:refs/heads/results-${{ matrix.arch }}"
